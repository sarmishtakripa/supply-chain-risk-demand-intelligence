x-runtime-environment: &runtime-environment
  PLATFORM_DATA_DIR: /app/data
  PLATFORM_ARTIFACT_DIR: /app/artifacts
  PLATFORM_SOURCE: ${PLATFORM_SOURCE:-demo}

services:
  init:
    build: .
    image: supply-chain-risk-demand-intelligence:local
    environment: *runtime-environment
    command:
      - python
      - -m
      - src.cli
      - run-all
      - --source
      - ${PLATFORM_SOURCE:-demo}
      - --input-dir
      - /app/input
    volumes:
      - platform-data:/app/data
      - platform-artifacts:/app/artifacts
      - ./input:/app/input:ro
    restart: "no"

  api:
    image: supply-chain-risk-demand-intelligence:local
    depends_on:
      init:
        condition: service_completed_successfully
    environment: *runtime-environment
    command: ["uvicorn", "src.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - platform-data:/app/data:ro
      - platform-artifacts:/app/artifacts:ro

  app:
    image: supply-chain-risk-demand-intelligence:local
    depends_on:
      init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    environment:
      <<: *runtime-environment
      PLATFORM_API_URL: http://api:8000
    command:
      - streamlit
      - run
      - src/dashboard.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - platform-data:/app/data:ro
      - platform-artifacts:/app/artifacts:ro

volumes:
  platform-data:
  platform-artifacts:
